name: Aplikacja na Androida (APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit -p .
      - run: npx vite build
      - run: npx cap sync android
      - name: Budowanie APK
        working-directory: android
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../Plan.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Plan-apk
          path: Plan.apk
      - name: Wydanie do pobrania
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Plan – Android (wersja 1.${{ github.run_number }})
          body: Plik Plan.apk do zainstalowania na telefonie. Nowa wersja instaluje się na starą bez utraty danych.
          files: Plan.apk
          make_latest: true
